<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Box Styling</title>
    <style type="text/css">
        body {
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-color: rgb(246, 206, 237);
            font-size: 1rem;
        }
        #ruler {
            position: relative;
            left: 0px;
            top: 0px;
            margin-bottom: 5px;
        }
        #column{
            width: 170px;
            background-color: rgb(249, 216, 197);
        }
        h4, p{ padding: 0 20px;}
        h4{ padding-top: 20px;}
        p{ padding-bottom: 20px;}
    </style>
</head>
<body> 
    <img id="ruler" src="ruler-4113045_960_720.png" alt="ruler" width="400" height="200">
    <div id="column">
        <h4>Box Styling</h4>
        <p>Box styling is a way to style the boxes that contain content on a webpage</p>
    </div>
</body>
</html>
